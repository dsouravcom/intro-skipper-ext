<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <style>
            :root {
                --bg: #f3f3f6;
                --surface: #ffffff;
                --surface-2: #f6f6f9;
                --border: #e7e7ee;
                --text: #18181b;
                --text-2: #6f6f7a;
                --accent: #6d5efc;
                --track: #d6d6de;
                --pill-bg: #ecebff;
                --pill-tx: #5a4ce0;
                --tile: #ffffff;
                --shadow: 0 1px 2px rgba(24, 24, 27, 0.06);
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #131316;
                    --surface: #1d1d21;
                    --surface-2: #26262c;
                    --border: #2d2d34;
                    --text: #f2f2f5;
                    --text-2: #9a9aa6;
                    --accent: #8b7dff;
                    --track: #3a3a44;
                    --pill-bg: #2b2a44;
                    --pill-tx: #b6acff;
                    --tile: #ffffff;
                    --shadow: none;
                }
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                width: 320px;
                background: var(--bg);
                color: var(--text);
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    Helvetica, Arial, sans-serif;
                -webkit-font-smoothing: antialiased;
                font-size: 14px;
                line-height: 1.45;
                padding: 14px;
            }

            /* ── App bar ─────────────────────────────────────────── */
            .appbar {
                display: flex;
                align-items: center;
                gap: 11px;
                padding: 4px 4px 14px;
            }
            .appbar .logo {
                width: 30px;
                height: 30px;
                border-radius: 8px;
                flex: none;
            }
            .brand {
                display: flex;
                flex-direction: column;
                min-width: 0;
            }
            .app-name {
                font-size: 15px;
                font-weight: 700;
                letter-spacing: -0.01em;
            }
            .app-status {
                font-size: 12px;
                color: var(--text-2);
            }
            .app-status.on {
                color: var(--accent);
            }
            .appbar .switch {
                margin-left: auto;
            }

            /* ── Service card ────────────────────────────────────── */
            .services {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .service-card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 14px;
                box-shadow: var(--shadow);
                transition:
                    opacity 0.2s ease,
                    border-color 0.2s ease;
            }
            .service-card.here {
                border-color: var(--accent);
            }
            .service-card.dim {
                opacity: 0.5;
            }

            .svc-head {
                display: flex;
                align-items: center;
                gap: 11px;
            }
            .avatar {
                width: 36px;
                height: 36px;
                border-radius: 9px;
                flex: none;
                display: grid;
                place-items: center;
                overflow: hidden;
                background: var(--tile);
                border: 1px solid var(--border);
            }
            .avatar img {
                width: 22px;
                height: 22px;
                display: block;
            }
            .avatar.fallback {
                border: none;
                color: #fff;
                font-weight: 700;
                font-size: 16px;
            }
            .svc-meta {
                min-width: 0;
                flex: 1;
            }
            .svc-name {
                font-size: 14px;
                font-weight: 600;
                display: flex;
                align-items: center;
                gap: 7px;
            }
            .svc-sub {
                font-size: 12px;
                color: var(--text-2);
            }
            .pill {
                font-size: 10px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.03em;
                color: var(--pill-tx);
                background: var(--pill-bg);
                padding: 2px 7px;
                border-radius: 999px;
                white-space: nowrap;
            }

            /* ── Skip-type sub rows ──────────────────────────────── */
            .types {
                margin-top: 12px;
                padding-top: 12px;
                border-top: 1px solid var(--border);
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            .type-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 5px 2px 5px 47px;
                transition: opacity 0.2s ease;
            }
            .type-row.dim {
                opacity: 0.45;
            }
            .type-label {
                font-size: 13px;
                font-weight: 500;
            }

            /* ── Empty state ─────────────────────────────────────── */
            .empty {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 26px 20px;
                text-align: center;
                box-shadow: var(--shadow);
            }
            .empty-icon {
                font-size: 26px;
            }
            .empty-title {
                margin-top: 8px;
                font-size: 14px;
                font-weight: 600;
            }
            .empty-text {
                margin-top: 4px;
                font-size: 12.5px;
                color: var(--text-2);
            }

            /* ── Switch ──────────────────────────────────────────── */
            .switch {
                position: relative;
                width: 40px;
                height: 24px;
                flex: none;
            }
            .switch input {
                position: absolute;
                opacity: 0;
                width: 100%;
                height: 100%;
                margin: 0;
                cursor: pointer;
            }
            .switch input:disabled {
                cursor: default;
            }
            .track {
                position: absolute;
                inset: 0;
                background: var(--track);
                border-radius: 999px;
                transition: background 0.2s ease;
                pointer-events: none;
            }
            .track::after {
                content: "";
                position: absolute;
                top: 3px;
                left: 3px;
                width: 18px;
                height: 18px;
                border-radius: 50%;
                background: #fff;
                box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
                transition: transform 0.2s ease;
            }
            .switch input:checked + .track {
                background: var(--accent);
            }
            .switch input:checked + .track::after {
                transform: translateX(16px);
            }
            .switch input:disabled + .track {
                opacity: 0.5;
            }
            .switch input:focus-visible + .track {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
            }

            /* ── Footer ──────────────────────────────────────────── */
            .settings-btn {
                margin-top: 14px;
                width: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 7px;
                background: transparent;
                color: var(--text-2);
                border: 1px solid var(--border);
                border-radius: 11px;
                padding: 10px;
                font: inherit;
                font-size: 13px;
                font-weight: 500;
                cursor: pointer;
                transition:
                    background 0.15s ease,
                    color 0.15s ease;
            }
            .settings-btn:hover {
                background: var(--surface);
                color: var(--text);
            }

            /* ── Credit ──────────────────────────────────────────── */
            .credit {
                display: block;
                text-align: center;
                margin-top: 10px;
                font-size: 11px;
                color: var(--text-2);
                text-decoration: none;
                opacity: 0.85;
                transition: opacity 0.15s ease;
            }
            .credit:hover {
                opacity: 1;
            }
            .credit .name {
                font-weight: 600;
                background: linear-gradient(90deg, var(--accent), #f47521);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
            }
        </style>
    </head>
    <body>
        <div class="appbar">
            <img src="icons/icon48.png" class="logo" alt="" />
            <div class="brand">
                <div class="app-name">Intro Skipper</div>
                <div class="app-status" id="masterStatus">Auto-skip is on</div>
            </div>
            <label class="switch">
                <input
                    type="checkbox"
                    id="masterToggle"
                    data-role="master"
                    aria-label="Enable Intro Skipper"
                />
                <span class="track"></span>
            </label>
        </div>

        <div class="services" id="services"></div>

        <button class="settings-btn" id="openSettings" type="button">
            <span aria-hidden="true">⚙</span> All settings
        </button>

        <a
            class="credit"
            href="https://sourav.dev"
            target="_blank"
            rel="noopener"
            >by <span class="name">Sourav</span></a
        >

        <script src="popup.js"></script>
    </body>
</html>
